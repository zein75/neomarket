events {}

http {
    server_tokens off;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    map $http_x_forwarded_proto $hsts_header {
        default "";
        https "max-age=31536000; includeSubDomains";
    }
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=checkout_rate:10m rate=2r/s;
    limit_req_status 429;
    upstream b2c { server b2c:8001; }
    upstream b2b { server b2b:8002; }

    # TLS is terminated by the platform load balancer.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name b2c.internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $hsts_header always;
        limit_req zone=api_rate burst=20 nodelay;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /health { proxy_pass http://b2c; }
        location = /ready { return 404; }
        location = /metrics { return 404; }
        location ^~ /api/v1/auth/ { limit_req zone=auth_rate burst=5 nodelay; proxy_pass http://b2c; }
        location ^~ /api/v1/orders { limit_req zone=checkout_rate burst=5 nodelay; proxy_pass http://b2c; }
        # Retired aliases are intentionally unavailable in production.
        location = /api/v1/products { return 410; }
        location ^~ /api/v1/products/ { return 410; }
        location ^~ /api/v1/catalog/products { return 410; }
        location = /api/v1/events/product { return 410; }
        location = /api/v1/b2b/events { return 404; }
        # Service-to-service contracts never cross the public gateway.
        location ^~ /internal/ { return 404; }
        location / { proxy_pass http://b2c; }
    }

    server {
        listen 80;
        server_name b2b.internal;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $hsts_header always;
        limit_req zone=api_rate burst=20 nodelay;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        location /health { proxy_pass http://b2b; }
        location = /ready { return 404; }
        location = /metrics { return 404; }
        location ^~ /api/v1/auth/ { limit_req zone=auth_rate burst=5 nodelay; proxy_pass http://b2b; }
        # The seller contract is namespaced under /seller; old aliases are retired.
        location = /api/v1/products { return 410; }
        location ^~ /api/v1/products/ { return 410; }
        location = /api/v1/inventory/reserve { return 404; }
        location = /api/v1/inventory/unreserve { return 404; }
        location = /api/v1/fulfill { return 404; }
        location = /api/v1/invoices { return 404; }
        location = /api/v1/reserve { return 404; }
        location = /api/v1/unreserve { return 404; }
        # Inventory and event receivers are private network endpoints.
        location ^~ /internal/ { return 404; }
        location / { proxy_pass http://b2b; }
    }
}
