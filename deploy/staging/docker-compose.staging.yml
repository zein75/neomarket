# Standalone staging Compose (DO NOT merge with docker-compose.yaml).
name: neomarket-staging
x-app-common: &app-common
  init: true
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neomarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomarket -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [backend]
    logging:
      options: {max-size: "5m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks: [backend]
    logging:
      options: {max-size: "5m", max-file: "3"}

  b2b:
    <<: *app-common
    image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE}/b2b:${RELEASE_SHA:?set RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment: &b2b-env
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://neomarket:${POSTGRES_PASSWORD}@postgres:5432/b2b
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${B2B_SECRET_KEY:?}
      SERVICE_KEY: ${SERVICE_KEY:?}
      SERVICE_NAME: b2b
      SERVICE_PRIVATE_KEY: ${B2B_SERVICE_PRIVATE_KEY:?}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?}
      SERVICE_KEY_ID: b2b-v1
      B2C_URL: http://b2c:8001
      MODERATION_URL: http://admin:8003
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 640m

  b2c:
    <<: *app-common
    image: ${REGISTRY_IMAGE}/b2c:${RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: &b2c-env
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://neomarket:${POSTGRES_PASSWORD}@postgres:5432/b2c
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${B2C_SECRET_KEY:?}
      SERVICE_KEY: ${SERVICE_KEY:?}
      SERVICE_NAME: b2c
      SERVICE_PRIVATE_KEY: ${B2C_SERVICE_PRIVATE_KEY:?}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?}
      SERVICE_KEY_ID: b2c-v1
      B2B_BASE_URL: http://b2b:8002
      RECOVERY_WORKER_POLL_INTERVAL_SECONDS: "30"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 640m

  admin:
    <<: *app-common
    image: ${REGISTRY_IMAGE}/admin:${RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment: &admin-env
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://neomarket:${POSTGRES_PASSWORD}@postgres:5432/admin
      SECRET_KEY: ${ADMIN_SECRET_KEY:?}
      SERVICE_KEY: ${SERVICE_KEY:?}
      SERVICE_NAME: admin
      SERVICE_PRIVATE_KEY: ${ADMIN_SERVICE_PRIVATE_KEY:?}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?}
      SERVICE_KEY_ID: admin-v1
      B2B_BASE_URL: http://b2b:8002
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 512m

  b2b-migrate:
    image: ${REGISTRY_IMAGE}/b2b:${RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *b2b-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [backend]
    profiles: [migrate]

  b2c-migrate:
    image: ${REGISTRY_IMAGE}/b2c:${RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *b2c-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [backend]
    profiles: [migrate]

  admin-migrate:
    image: ${REGISTRY_IMAGE}/admin:${RELEASE_SHA}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *admin-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [backend]
    profiles: [migrate]

  gateway:
    image: nginx:1.27-alpine
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/var/cache/nginx", "/var/run"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      b2b: {condition: service_healthy}
      b2c: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: b2c.internal' http://127.0.0.1/health && wget -q -O /dev/null --header='Host: b2b.internal' http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [backend, edge]
    mem_limit: 96m
    logging:
      options: {max-size: "5m", max-file: "3"}

networks:
  backend:
    internal: true
  edge: {}
volumes:
  pgdata:
  redisdata:
