name: B2B reservation

on:
  push:
    paths:
      - "services/b2b/**"
      - "services/b2c/**"
      - "services/admin/**"
      - "shared/**"
      - "docs/canon/flows/b2b-flows.md"
      - "docs/protocols/b2b/openapi.yaml"
      - ".github/workflows/b2b-reservation.yml"
  pull_request:
    paths:
      - "services/b2b/**"
      - "services/b2c/**"
      - "services/admin/**"
      - "shared/**"
      - "docs/canon/flows/b2b-flows.md"
      - "docs/protocols/b2b/openapi.yaml"
      - ".github/workflows/b2b-reservation.yml"

jobs:
  reservation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b2b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Apply B2B PostgreSQL schema
        working-directory: services/b2b
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/b2b
        run: uv run alembic upgrade head
      - name: Run canonical reservation scenarios
        working-directory: services/b2b
        run: >-
          uv run pytest -q tests/test_inventory_reservations.py
          -k "reserve_all_skus_succeeds or
          idempotent_reserve_returns_200_without_double_deduction or
          idempotent_reserve_returns_original_remaining_stock_after_new_operation or
          reserve_same_key_different_payload_returns_conflict_without_mutation or
          partial_insufficient_stock_returns_409_all_rollback or
          sku_out_of_stock_event_emitted or
          persisted_outbox_event_retries_after_b2c_recovers or
          unreserve_restores_quantities"
      - name: Run PostgreSQL reservation atomicity and concurrency scenarios
        working-directory: services/b2b
        env:
          NEOMARKET_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/b2b
        run: >-
          uv run pytest -q tests/test_inventory_reservations.py
          -k "postgres_multi_sku_reserve_and_replay or postgres_same_key_different_payload_returns_conflict or postgres_concurrent_same_key_reserves_once"
      - name: Run moderation decision scenarios
        working-directory: services/b2b
        run: uv run pytest -q tests/test_apply_moderation.py
      - name: Run B2C event cascade scenarios
        working-directory: services/b2c
        run: uv run pytest -q tests/test_b2b_events.py
