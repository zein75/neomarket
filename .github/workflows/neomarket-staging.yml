name: NeoMarket - verify, build, staging deploy

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neomarket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Static checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check code, contract and tests
        shell: bash
        run: bash ci/verify.sh

  integration:
    name: PostgreSQL migration and concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_password_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci_test_password_only
      POSTGRES_DB: postgres
      PGUSER: ci
      PGPASSWORD: ci_test_password_only
      NEOMARKET_POSTGRES_TEST_URL: postgresql+asyncpg://ci:ci_test_password_only@127.0.0.1:5432/b2b
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Apply all migrations and concurrency tests
        shell: bash
        run: bash ci/postgres-integration.sh

  build:
    name: Build ${{ matrix.service }} and push to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    needs: [verify, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [b2b, b2c, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry name to lowercase
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable SHA-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  build_frontends:
    name: Build frontend ${{ matrix.service }} and push to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'
    needs: [verify, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: storefront
            dockerfile: frontend/apps/storefront/Dockerfile
          - service: seller
            dockerfile: frontend/apps/seller/Dockerfile
          - service: admin-frontend
            dockerfile: frontend/apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry name to lowercase
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable SHA-tagged frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy_staging:
    name: Deploy to private staging over SSH (manual run only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    needs: [verify, integration, build, build_frontends]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: neomarket-staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with verified host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/neomarket_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/neomarket_deploy_key" "$HOME/.ssh/known_hosts"
      - name: Request root-owned staging deployment
        shell: bash
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : "${HOST:?Missing STAGING_SSH_HOST}"
          : "${USER:?Missing STAGING_SSH_USER}"
          PORT="${PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          [[ "$USER" == "neomarket-deploy" ]]
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SSH_ARGS=(-i "$HOME/.ssh/neomarket_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$PORT")
          ssh "${SSH_ARGS[@]}" "$USER@$HOST" "neomarket-staging-request '$SHA'"
