name: B2C orders

on:
  push:
    paths:
      - "services/b2c/**"
      - "services/b2b/**"
      - "shared/**"
      - "docs/canon/flows/b2c-orders-flows.md"
      - "docs/protocols/b2c/openapi.yaml"
      - ".github/workflows/b2c-orders.yml"
  pull_request:
    paths:
      - "services/b2c/**"
      - "services/b2b/**"
      - "shared/**"
      - "docs/canon/flows/b2c-orders-flows.md"
      - "docs/protocols/b2c/openapi.yaml"
      - ".github/workflows/b2c-orders.yml"

jobs:
  orders:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b2c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Apply B2C PostgreSQL schema
        working-directory: services/b2c
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/b2c
        run: uv run alembic upgrade head
      - name: Run canonical checkout and cancellation scenarios
        working-directory: services/b2c
        run: >-
          uv run pytest -q tests/test_orders.py
          -k "checkout_creates_paid_order_with_fixed_prices or
          partial_reserve_failure_returns_409 or
          idempotency_returns_existing_order or
          b2b_unavailable_returns_503 or
          concurrent_idempotency_race_returns_existing_order or
          duplicate_checkout_unreserve_failure_persists_compensation or
          idempotency_key_does_not_return_another_users_order or
          checkout_compensates_reserve_when_persistence_fails or
          checkout_compensates_reserve_when_created_order_cannot_reload or
          cancel_paid_order_transitions_to_cancelled or
          unreserve_failure_transitions_to_cancel_pending or
          cancel_assembling_order_transitions_to_cancelled or
          cancel_delivering_order_transitions_to_cancelled or
          cancel_delivered_order_returns_409 or
          other_user_order_returns_404"
      - name: Run PostgreSQL checkout and cancellation concurrency scenarios
        working-directory: services/b2c
        env:
          NEOMARKET_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/b2c
        run: uv run pytest -q tests/test_postgres_order_concurrency.py
