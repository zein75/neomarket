name: B2C checkout

on:
  push:
    paths:
      - "services/b2c/**"
      - "services/b2b/**"
      - "shared/**"
      - "docs/canon/flows/b2c-orders-flows.md"
      - "docs/protocols/b2c/openapi.yaml"
      - ".github/workflows/b2c-orders.yml"
  pull_request:
    paths:
      - "services/b2c/**"
      - "services/b2b/**"
      - "shared/**"
      - "docs/canon/flows/b2c-orders-flows.md"
      - "docs/protocols/b2c/openapi.yaml"
      - ".github/workflows/b2c-orders.yml"

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Run canonical checkout scenarios and regression gates
        working-directory: services/b2c
        run: >-
          uv run pytest -q tests/test_orders.py
          -k "checkout_creates_paid_order_with_fixed_prices or
          partial_reserve_failure_returns_409 or
          idempotency_returns_existing_order or
          b2b_unavailable_returns_503 or
          concurrent_idempotency_race_returns_existing_order or
          idempotency_key_does_not_return_another_users_order or
          checkout_compensates_reserve_when_persistence_fails or
          checkout_compensates_reserve_when_created_order_cannot_reload"
