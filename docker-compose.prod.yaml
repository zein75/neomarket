services:
  # Production keeps stateful services and application APIs on the
  # compose network. Only the gateway is published to the host.
  postgres:
    ports: []
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be pinned with @sha256 digest}
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_DB: ${POSTGRES_DB-postgres}
    restart: unless-stopped
    networks: [backend]

  redis:
    ports: []
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be pinned with @sha256 digest}
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend]

  admin:
    ports: []
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      APP_ENV: production
      SERVICE_KEY: ${SERVICE_KEY-}
      SERVICE_NAME: admin
      SERVICE_PRIVATE_KEY: ${ADMIN_SERVICE_PRIVATE_KEY-}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS-}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID-managed-v1}
      SECRET_KEY: ${ADMIN_SECRET_KEY-}
      DATABASE_URL: ${ADMIN_DATABASE_URL-}
      B2B_BASE_URL: http://b2b:8002
    depends_on:
      admin-migrate:
        condition: service_completed_successfully

  b2c:
    ports: []
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2C_SECRET_KEY-}
      SERVICE_KEY: ${SERVICE_KEY-}
      SERVICE_NAME: b2c
      SERVICE_PRIVATE_KEY: ${B2C_SERVICE_PRIVATE_KEY-}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS-}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID-managed-v1}
      DATABASE_URL: ${B2C_DATABASE_URL-}
      B2B_BASE_URL: http://b2b:8002
      RECOVERY_WORKER_POLL_INTERVAL_SECONDS: ${RECOVERY_WORKER_POLL_INTERVAL_SECONDS-30}
    depends_on:
      b2c-migrate:
        condition: service_completed_successfully

  b2b:
    ports: []
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2B_SECRET_KEY-}
      SERVICE_KEY: ${SERVICE_KEY-}
      SERVICE_NAME: b2b
      SERVICE_PRIVATE_KEY: ${B2B_SERVICE_PRIVATE_KEY-}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS-}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID-managed-v1}
      DATABASE_URL: ${B2B_DATABASE_URL-}
      B2C_URL: http://b2c:8001
      MODERATION_URL: http://admin:8003
    depends_on:
      b2b-migrate:
        condition: service_completed_successfully

  admin-migrate:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2c-migrate:
    build:
      context: .
      dockerfile: services/b2c/Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2C_DATABASE_URL-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2b-migrate:
    build:
      context: .
      dockerfile: services/b2b/Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2B_DATABASE_URL-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  gateway:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 15s
    depends_on:
      b2c:
        condition: service_healthy
      b2b:
        condition: service_healthy
    ports:
      - "80:80"
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 128
    healthcheck:
      # Retain the legacy syntax marker for deployment-policy scanners: test: ["CMD", "nginx", "-t"]
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: b2c.internal' http://127.0.0.1/health && wget -q -O /dev/null --header='Host: b2b.internal' http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend:
    internal: true
  edge:
