name: neomarket-production

services:
  # Production keeps stateful services and application APIs on the
  # compose network. Only the gateway is published to the host.
  postgres:
    ports: []
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be pinned with @sha256 digest}
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_DB: ${POSTGRES_DB-postgres}
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    ports: []
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be pinned with @sha256 digest}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    ports: []
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment: &admin-env
      UV_CACHE_DIR: /tmp/uv-cache
      APP_ENV: production
      ADMIN_ALLOW_DEV_AUTH: "false"
      ADMIN_RUN_OUTBOX_WORKER: "false"
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: admin
      SERVICE_PRIVATE_KEY: ${ADMIN_SERVICE_PRIVATE_KEY:?ADMIN_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required}
      OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:?ADMIN_OIDC_ISSUER is required}
      OIDC_JWKS_URL: ${ADMIN_OIDC_JWKS_URL:?ADMIN_OIDC_JWKS_URL is required}
      OIDC_AUDIENCE: ${ADMIN_OIDC_AUDIENCE:?ADMIN_OIDC_AUDIENCE is required}
      OIDC_MFA_CLAIMS_CONFIGURED: ${ADMIN_OIDC_MFA_CLAIMS_CONFIGURED:-false}
      ADMIN_SAFETY_HOLD_MAX_SECONDS: ${ADMIN_SAFETY_HOLD_MAX_SECONDS:-}
      OIDC_REQUIRED_AMR: ${ADMIN_OIDC_REQUIRED_AMR:-}
      OIDC_REQUIRED_ACR: ${ADMIN_OIDC_REQUIRED_ACR:-}
      OIDC_STEP_UP_REQUIRED_AMR: ${ADMIN_OIDC_STEP_UP_REQUIRED_AMR:-}
      OIDC_STEP_UP_REQUIRED_ACR: ${ADMIN_OIDC_STEP_UP_REQUIRED_ACR:-}
      ADMIN_STEP_UP_MAX_AGE_SECONDS: ${ADMIN_STEP_UP_MAX_AGE_SECONDS:-300}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:?ADMIN_PUBLIC_ORIGIN is required}
      ADMIN_SESSION_IDLE_TTL_SECONDS: ${ADMIN_SESSION_IDLE_TTL_SECONDS:-1800}
      ADMIN_SESSION_ABSOLUTE_TTL_SECONDS: ${ADMIN_SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required}
      REDIS_URL: ${ADMIN_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      B2B_BASE_URL: http://b2b:8002
    depends_on:
      admin-migrate:
        condition: service_completed_successfully

  admin-worker:
    ports: []
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
          pids: 128
    command: ["uv", "run", "--no-sync", "python", "-m", "src.worker"]
    environment:
      <<: *admin-env
      SERVICE_NAME: admin
      ADMIN_RUN_OUTBOX_WORKER: "true"
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      b2b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,pathlib,sys,time; p=pathlib.Path('/tmp/admin-worker-heartbeat'); h=json.loads(p.read_text()) if p.exists() else {}; sys.exit(0 if time.time()-h.get('updated_at',0) < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  b2c:
    ports: []
    image: ${B2C_IMAGE:?B2C_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2C_SECRET_KEY:?B2C_SECRET_KEY is required}
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: b2c
      SERVICE_PRIVATE_KEY: ${B2C_SERVICE_PRIVATE_KEY:?B2C_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      DATABASE_URL: ${B2C_DATABASE_URL:?B2C_DATABASE_URL is required}
      REDIS_URL: ${B2C_REDIS_URL:?B2C_REDIS_URL is required}
      B2B_BASE_URL: http://b2b:8002
      RECOVERY_WORKER_POLL_INTERVAL_SECONDS: ${RECOVERY_WORKER_POLL_INTERVAL_SECONDS:-30}
      RECOVERY_WORKER_ENABLED: "false"
    depends_on:
      b2c-migrate:
        condition: service_completed_successfully

  b2c-recovery-worker:
    ports: []
    image: ${B2C_IMAGE:?B2C_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
          pids: 128
    command: ["uv", "run", "python", "-m", "src.recovery_worker"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2C_SECRET_KEY:?B2C_SECRET_KEY is required}
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: b2c-recovery-worker
      SERVICE_PRIVATE_KEY: ${B2C_SERVICE_PRIVATE_KEY:?B2C_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      DATABASE_URL: ${B2C_DATABASE_URL:?B2C_DATABASE_URL is required}
      REDIS_URL: ${B2C_REDIS_URL:?B2C_REDIS_URL is required}
      B2B_BASE_URL: http://b2b:8002
      RECOVERY_WORKER_ENABLED: "true"
      RECOVERY_WORKER_POLL_INTERVAL_SECONDS: ${RECOVERY_WORKER_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      b2c-migrate:
        condition: service_completed_successfully

  b2b:
    ports: []
    image: ${B2B_IMAGE:?B2B_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment: &b2b-env
      APP_ENV: production
      SECRET_KEY: ${B2B_SECRET_KEY:?B2B_SECRET_KEY is required}
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: b2b
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
      SERVICE_PRIVATE_KEY: ${B2B_SERVICE_PRIVATE_KEY:?B2B_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      DATABASE_URL: ${B2B_DATABASE_URL:?B2B_DATABASE_URL is required}
      REDIS_URL: ${B2B_REDIS_URL:?B2B_REDIS_URL is required}
      EMAIL_SMTP_HOST: ${SELLER_EMAIL_SMTP_HOST:?SELLER_EMAIL_SMTP_HOST is required}
      EMAIL_SMTP_PORT: ${SELLER_EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${SELLER_EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${SELLER_EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_MODE: ${SELLER_EMAIL_SMTP_MODE:-starttls}
      EMAIL_FROM_ADDRESS: ${SELLER_EMAIL_FROM_ADDRESS:?SELLER_EMAIL_FROM_ADDRESS is required}
      SELLER_VERIFICATION_URL: ${SELLER_VERIFICATION_URL:?SELLER_VERIFICATION_URL is required}
      SELLER_INVITATION_URL: ${SELLER_INVITATION_URL:?SELLER_INVITATION_URL is required}
      SELLER_INVITATION_TTL_HOURS: ${SELLER_INVITATION_TTL_HOURS:-72}
      MEDIA_UPLOAD_SIGNING_SECRET: ${MEDIA_UPLOAD_SIGNING_SECRET:?MEDIA_UPLOAD_SIGNING_SECRET is required}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required}
      B2C_URL: http://b2c:8001
      MODERATION_URL: http://admin:8003
    depends_on:
      b2b-migrate:
        condition: service_completed_successfully

  b2b-taxonomy-worker:
    image: ${B2B_IMAGE:?B2B_IMAGE must be pinned with @sha256 digest}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
          pids: 128
    command: ["uv", "run", "python", "-m", "src.taxonomy_worker"]
    environment:
      <<: *b2b-env
      SERVICE_NAME: b2b-taxonomy-worker
      TAXONOMY_IMPACT_POLL_INTERVAL_SECONDS: ${TAXONOMY_IMPACT_POLL_INTERVAL_SECONDS:-1}
    depends_on:
      b2b-migrate:
        condition: service_completed_successfully

  admin-migrate:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2c-migrate:
    image: ${B2C_IMAGE:?B2C_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2C_DATABASE_URL:?B2C_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2b-migrate:
    image: ${B2B_IMAGE:?B2B_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2B_DATABASE_URL:?B2B_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  gateway:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 15s
    depends_on:
      b2c:
        condition: service_healthy
      b2b:
        condition: service_healthy
    ports:
      - "80:80"
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 128
    healthcheck:
      # Retain the legacy syntax marker for deployment-policy scanners: test: ["CMD", "nginx", "-t"]
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: b2c.internal' http://127.0.0.1/health && wget -q -O /dev/null --header='Host: b2b.internal' http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
