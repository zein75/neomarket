name: neomarket-production

services:
  # Production keeps stateful services and application APIs on the
  # compose network. Only the gateway is published to the host.
  postgres:
    ports: []
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be pinned with @sha256 digest}
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-}
      POSTGRES_DB: ${POSTGRES_DB-postgres}
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    ports: []
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be pinned with @sha256 digest}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [backend]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin:
    ports: []
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      APP_ENV: production
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: admin
      SERVICE_PRIVATE_KEY: ${ADMIN_SERVICE_PRIVATE_KEY:?ADMIN_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY is required}
      OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:?ADMIN_OIDC_ISSUER is required}
      OIDC_JWKS_URL: ${ADMIN_OIDC_JWKS_URL:?ADMIN_OIDC_JWKS_URL is required}
      OIDC_AUDIENCE: ${ADMIN_OIDC_AUDIENCE:?ADMIN_OIDC_AUDIENCE is required}
      OIDC_REQUIRED_AMR: ${ADMIN_OIDC_REQUIRED_AMR:-mfa}
      DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required}
      B2B_BASE_URL: http://b2b:8002
    depends_on:
      admin-migrate:
        condition: service_completed_successfully

  b2c:
    ports: []
    image: ${B2C_IMAGE:?B2C_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2C_SECRET_KEY:?B2C_SECRET_KEY is required}
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: b2c
      SERVICE_PRIVATE_KEY: ${B2C_SERVICE_PRIVATE_KEY:?B2C_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      DATABASE_URL: ${B2C_DATABASE_URL:?B2C_DATABASE_URL is required}
      REDIS_URL: ${B2C_REDIS_URL:?B2C_REDIS_URL is required}
      B2B_BASE_URL: http://b2b:8002
      RECOVERY_WORKER_POLL_INTERVAL_SECONDS: ${RECOVERY_WORKER_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      b2c-migrate:
        condition: service_completed_successfully

  b2b:
    ports: []
    image: ${B2B_IMAGE:?B2B_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${B2B_SECRET_KEY:?B2B_SECRET_KEY is required}
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
      SERVICE_NAME: b2b
      SERVICE_PRIVATE_KEY: ${B2B_SERVICE_PRIVATE_KEY:?B2B_SERVICE_PRIVATE_KEY is required}
      TRUSTED_SERVICE_PUBLIC_KEYS: ${TRUSTED_SERVICE_PUBLIC_KEYS:?TRUSTED_SERVICE_PUBLIC_KEYS is required}
      SERVICE_KEY_ID: ${SERVICE_KEY_ID:?SERVICE_KEY_ID is required}
      DATABASE_URL: ${B2B_DATABASE_URL:?B2B_DATABASE_URL is required}
      REDIS_URL: ${B2B_REDIS_URL:?B2B_REDIS_URL is required}
      B2C_URL: http://b2c:8001
      MODERATION_URL: http://admin:8003
    depends_on:
      b2b-migrate:
        condition: service_completed_successfully

  admin-migrate:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2c-migrate:
    image: ${B2C_IMAGE:?B2C_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2C_DATABASE_URL:?B2C_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  b2b-migrate:
    image: ${B2B_IMAGE:?B2B_IMAGE must be pinned with @sha256 digest}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${B2B_DATABASE_URL:?B2B_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]

  gateway:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be pinned with @sha256 digest}
    init: true
    stop_grace_period: 15s
    depends_on:
      b2c:
        condition: service_healthy
      b2b:
        condition: service_healthy
    ports:
      - "80:80"
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 128
    healthcheck:
      # Retain the legacy syntax marker for deployment-policy scanners: test: ["CMD", "nginx", "-t"]
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: b2c.internal' http://127.0.0.1/health && wget -q -O /dev/null --header='Host: b2b.internal' http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
