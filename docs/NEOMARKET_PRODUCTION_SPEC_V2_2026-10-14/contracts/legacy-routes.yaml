    - {method: POST, path: /api/v1/fulfill, owner: b2b, sunset: 2026-12-31}
    - {method: POST, path: /api/v1/invoices, owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: /api/v1/products, owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/products/{product_id}", owner: b2b, sunset: 2026-12-31}
    - {method: PATCH, path: "/api/v1/products/{product_id}", owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/products/{product_id}/skus", owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: /api/v1/public/categories, owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/public/categories/{category_id}", owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: /api/v1/public/products, owner: b2b, sunset: 2026-12-31}
    - {method: POST, path: /api/v1/public/products/batch, owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/public/products/{product_id}", owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/public/products/{product_id}/similar", owner: b2b, sunset: 2026-12-31}
    - {method: GET, path: "/api/v1/public/skus/{sku_id}", owner: b2b, sunset: 2026-12-31}
    - {method: PUT, path: "/api/v1/seller/products/{product_id}", owner: b2b, sunset: 2026-12-31}
    - {method: DELETE, path: "/api/v1/seller/skus/{sku_id}", owner: b2b, sunset: 2026-12-31}
    - {method: PUT, path: "/api/v1/seller/skus/{sku_id}", owner: b2b, sunset: 2026-12-31}
    - {method: POST, path: /api/v1/skus, owner: b2b, sunset: 2026-12-31}
  admin:
    - {method: POST, path: "/admin/v1/moderation/tickets/{ticket_id}/decisions/block", owner: admin, sunset: 2026-12-31}
