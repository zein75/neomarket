openapi: 3.1.0
info:
  title: NeoMarket Admin BFF API (TARGET ONLY)
  version: 1.0.0-draft
  description: Proposed contract for implementation. NOT an inventory of currently working endpoints. All authorization
    and mutation constraints apply server-side. Internal B2B taxonomy commands are specified separately in the architecture.
servers:
- url: https://admin.market.example.invalid
  description: Placeholder; replace with approved real domain
tags:
- name: me
- name: session
- name: dashboard
- name: moderation
- name: products
- name: taxonomy
- name: blocking-reasons
- name: sellers
- name: complaints
- name: appeals
- name: bulk-operations
- name: operations
- name: audit-events
- name: staff
- name: policies
- name: settings
paths:
  /admin/v1/me:
    get:
      operationId: GET_admin_v1_me
      summary: Get authenticated staff principal
      tags:
      - me
      security:
      - adminSession: []
      x-required-permission: session.read
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401': &id001
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403': &id002
          description: Insufficient permission
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id003
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412': &id004
          description: Stale resource version
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': &id005
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/v1/session/logout:
    post:
      operationId: POST_admin_v1_session_logout
      summary: Revoke own admin session
      tags:
      - session
      security:
      - adminSession: []
      x-required-permission: session.revoke
      responses:
        '202':
          description: Accepted command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id006
          type: string
          format: uuid
  /admin/v1/dashboard:
    get:
      operationId: GET_admin_v1_dashboard
      summary: Real queue and delivery metrics
      tags:
      - dashboard
      security:
      - adminSession: []
      x-required-permission: dashboard.read
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/v1/moderation/tickets:
    get:
      operationId: GET_admin_v1_moderation_tickets
      summary: Cursor-paginated moderation queue
      tags:
      - moderation
      security:
      - adminSession: []
      x-required-permission: moderation.ticket.read
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - &id007
        name: cursor
        in: query
        schema:
          type: string
      - &id008
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
      - name: priority
        in: query
        schema:
          type: integer
          minimum: 0
      - name: seller_id
        in: query
        schema: *id006
  /admin/v1/moderation/tickets/{ticket_id}:
    get:
      operationId: GET_admin_v1_moderation_tickets_ticket_id
      summary: Immutable ticket snapshot and workflow
      tags:
      - moderation
      security:
      - adminSession: []
      x-required-permission: moderation.ticket.read
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema: *id006
  /admin/v1/moderation/tickets/{ticket_id}/claim:
    post:
      operationId: POST_admin_v1_moderation_tickets_ticket_id_claim
      summary: Acquire fencing lease
      tags:
      - moderation
      security:
      - adminSession: []
      x-required-permission: moderation.ticket.claim
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Resource ETag / expected version
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id006
      - name: ticket_id
        in: path
        required: true
        schema: *id006
  /admin/v1/moderation/tickets/{ticket_id}/heartbeat:
    post:
      operationId: POST_admin_v1_moderation_tickets_ticket_id_heartbeat
      summary: Renew lease
      tags:
      - moderation
      security:
      - adminSession: []
      x-required-permission: moderation.ticket.claim
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseInput'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Resource ETag / expected version
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id006
      - name: ticket_id
        in: path
        required: true
        schema: *id006
  /admin/v1/moderation/tickets/{ticket_id}/release:
    post:
      operationId: POST_admin_v1_moderation_tickets_ticket_id_release
      summary: Release lease
      tags:
      - moderation
      security:
      - adminSession: []
      x-required-permission: moderation.ticket.claim
      responses:
        '200':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationTicket'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseInput'
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Resource ETag / expected version
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id006
      - name: ticket_id
        in: path
        required: true
        schema: *id006
  /admin/v1/moderation/tickets/{ticket_id}/decisions:
    post:
      operationId: POST_admin_v1_moderation_tickets_ticket_id_decisions
      summary: Record one version-bound decision
      tags:
