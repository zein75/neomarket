  /admin/v1/products/{product_id}/safety-hold:
    post:
      operationId: POST_admin_v1_products_product_id_safety_hold
      summary: Apply temporary product visibility hold
      description: Requires an approved ADMIN_SAFETY_HOLD_MAX_SECONDS policy. Holds within that duration are queued immediately; longer holds wait for independent approval. Returns 503 and writes nothing when the policy is not configured. Expiry and policy are revalidated at approval time.
      tags:
      - products
      security:
      - adminSession: []
      x-required-permission: products.safety_hold
      responses:
        '202':
          description: Accepted command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
