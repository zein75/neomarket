components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-nm_admin_access
      description: Opaque BFF session; server-side OIDC+MFA required. Mutations also validate CSRF
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived bearer from the configured OIDC provider; accepted only for session exchange and step-up
  responses:
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Required service or audit storage unavailable
      headers:
        Retry-After:
          description: Minimum delay before retrying
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body exceeds the configured size limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: JSON content type is required for request bodies
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    IntegrationCapability:
      type: object
      properties:
        key:
          type: string
          enum:
          - identity_provider
          - mfa_step_up
          - b2b_admin_api
          - seller_kyc
          - evidence_av_scan
          - case_notice_delivery
          - payment_disputes
          - delivery_logs
        status:
          type: string
          enum:
          - CONFIGURED_UNVERIFIED
          - NOT_CONFIGURED
        blocked_actions:
          type: array
          items:
            type: string
        detail:
          type: string
      required:
      - key
      - status
      - blocked_actions
      - detail
      additionalProperties: false
    IntegrationStatus:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationCapability'
      required:
      - as_of
      - items
      additionalProperties: false
    RuntimeSettingSection:
      type: object
      properties:
        key:
          type: string
          enum:
          - queue_policy
          - workflow_settings
          - deployment_settings
          - moderation_sla
          - safety_hold_policy
          - notification_settings
          - retention_status
        status:
          type: string
          enum:
          - CONFIGURED_VERSIONED
          - CONFIGURED_UNVERSIONED
          - NOT_CONFIGURED
          - BLOCKED_PENDING_DECISION
        source:
          type: string
          enum:
          - database
          - environment
          - none
        version:
          type: integer
          minimum: 1
        writable:
          type: boolean
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: integer
            - type: number
            - type: boolean
            - type: string
            - type: 'null'
        detail:
          type: string
      required:
      - key
      - status
      - source
      - writable
      - values
      - detail
      additionalProperties: false
    RuntimeSettingsProposalInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        values:
          type: object
          additionalProperties:
            anyOf:
            - type: integer
            - type: number
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]*$'
      required:
      - expected_version
      - values
      - reason_code
      additionalProperties: false
    RuntimeSettings:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeSettingSection'
      required:
      - as_of
      - items
      additionalProperties: false
    SessionCreated:
      type: object
      properties:
        authenticated:
          type: boolean
          const: true
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - authenticated
      - csrf_token
      - expires_at
      additionalProperties: false
    StaffSessionItem:
      type: object
      properties:
        session_id: *id006
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        absolute_expires_at: {type: string, format: date-time}
        step_up_expires_at:
