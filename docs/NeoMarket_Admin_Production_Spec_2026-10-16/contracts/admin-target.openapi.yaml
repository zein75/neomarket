      security:
      - adminSession: []
      x-required-permission: moderation.decision.write
      responses:
        '202':
          description: Accepted command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401': *id001
        '403': *id002
        '409': *id003
        '412': *id004
        '422': *id005
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
