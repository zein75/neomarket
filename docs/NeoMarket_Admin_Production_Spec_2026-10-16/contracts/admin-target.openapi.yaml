        reason_code:
          type: string
        comment:
          type: string
      required:
      - field_path
      - reason_code
      - comment
      additionalProperties: false
    DecisionInput:
      type: object
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - CHANGES_REQUESTED
          - REJECT
          - HARD_BLOCK
          - ESCALATE
        claim_token:
          type: string
        product_revision: *id010
        snapshot_hash:
          type: string
        reason_codes:
          type: array
          items:
            type: string
        passed_rules:
          type: array
          maxItems: 30
          description: Rule codes the moderator recorded as passed for an approval.
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,63}$
        field_reports:
          type: array
          items:
            $ref: '#/components/schemas/FieldReport'
        comment:
          type: string
          maxLength: 3000
        policy_version: *id010
      allOf:
      - if:
          properties:
            action:
              const: CHANGES_REQUESTED
          required:
          - action
        then:
          properties:
            field_reports:
              minItems: 1
      - if:
          properties:
            action:
              enum:
              - REJECT
              - HARD_BLOCK
          required:
          - action
        then:
          properties:
            field_reports:
              minItems: 1
            comment:
              minLength: 1
      - if:
          properties:
            action:
              const: APPROVE
          required:
          - action
        then:
          properties:
            passed_rules:
              minItems: 1
      - if:
          properties:
            action:
              enum:
              - CHANGES_REQUESTED
              - REJECT
              - HARD_BLOCK
              - ESCALATE
          required:
          - action
        then:
          properties:
            passed_rules:
              maxItems: 0
      required:
      - action
      - claim_token
      - product_revision
      - snapshot_hash
      - policy_version
      additionalProperties: false
    DecisionResult:
      type: object
